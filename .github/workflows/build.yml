# EBoyTerminal 编译期依赖 IE2（SCIENEW）工程：与 monorepo 中 Addons/EBoyTerminal 相对路径一致。
# Industrial-Era-2 为 private 时，须在仓库 Secrets 配置 IE2_REPO_TOKEN（见 docs/README.md）。
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Require IE2 checkout token
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IE2_REPO_TOKEN)) {
            Write-Error @"
          IE2_REPO_TOKEN secret is not set.
          Industrial-Era-2 is private; add a PAT with read access to that repo as repository secret IE2_REPO_TOKEN.
          See docs/README.md (CI section).
          "@
          }
        env:
          IE2_REPO_TOKEN: ${{ secrets.IE2_REPO_TOKEN }}

      - name: Checkout Industrial Era 2 (SCIENEW + 传递依赖)
        uses: actions/checkout@v4
        with:
          repository: CS-LX/Industrial-Era-2
          ref: NEXT
          path: ie2
          submodules: recursive
          token: ${{ secrets.IE2_REPO_TOKEN }}

      - name: Checkout EBoyTerminal (this revision)
        uses: actions/checkout@v4
        with:
          path: ie2/Addons/EBoyTerminal

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: ie2/Addons/EBoyTerminal
        run: dotnet restore EBoyTerminal.csproj

      - name: Build
        working-directory: ie2/Addons/EBoyTerminal
        run: dotnet build EBoyTerminal.csproj -c Release --no-restore

      - name: Pack scmod
        shell: pwsh
        working-directory: ie2/Addons/EBoyTerminal
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "ie2/Addons/EBoyTerminal"
          $out = Join-Path $root "bin/Release/net10.0"
          $artifact = Join-Path $env:RUNNER_TEMP "eboy-terminal-artifacts"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          & (Join-Path $root "tools/pack.ps1") `
            -BuildOutputDir $out `
            -Configuration Release `
            -ArtifactDir $artifact

      - uses: actions/upload-artifact@v4
        with:
          name: EBoyTerminal-scmod
          path: ${{ runner.temp }}/eboy-terminal-artifacts/*.scmod
